fixed:
  type: polars
prompts:
  schema:
    hint: "default schema name"
    default: "main"
  _choose_catalog_type:
    local:
      _fixed_catalog_type: local
      root:
        hint: "root path for local storage"
        default: "./data"
    s3:
      _fixed_catalog_type: s3
      bucket:
        hint: "S3 bucket name"
    azure:
      _fixed_catalog_type: azure
      account_name:
        hint: "Azure storage account name"
      container:
        hint: "container name"
    databricks:
      _fixed_catalog_type: databricks
      catalog_name:
        hint: "Unity Catalog catalog name"
      host:
        hint: "workspace URL"
    fabric:
      _fixed_catalog_type: fabric
      workspace:
        hint: "Fabric workspace name or ID"
      lakehouse:
        hint: "Lakehouse name or ID"
    snowflake:
      _fixed_catalog_type: snowflake
      account:
        hint: "account identifier: <organization>-<account>"
      database_name:
        hint: "Snowflake database for the Iceberg tables"
      role:
        hint: "role to act as"
    iceberg:
      _fixed_catalog_type: iceberg
