name: CI

on:
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: "Test / py${{ matrix.python-version }} / ${{ matrix.deps }}"
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        deps: ["latest", "lowest-direct"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} ${{ matrix.deps == 'lowest-direct' && '--resolution=lowest-direct' || '' }}

      - name: Run tests
        run: uv run --no-sync --python ${{ matrix.python-version }} pytest -n auto

  test-file-formats:
    name: "Test / py3.12 / ${{ matrix.config }}"
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        config: ["csv", "parquet"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12

      - name: Run tests (${{ matrix.config }})
        run: uv run --python 3.12 pytest -n 0 --config ${{ matrix.config }}

  test-iceberg:
    name: "Test iceberg / py${{ matrix.python-version }} / ${{ matrix.deps }}"
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        deps: ["latest", "lowest-direct"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra iceberg ${{ matrix.deps == 'lowest-direct' && '--resolution=lowest-direct' || '' }}

      - name: Run tests (iceberg catalog)
        run: uv run --no-sync --python ${{ matrix.python-version }} pytest -n auto --profile iceberg

  catalog-template:
    name: "Catalog template / ${{ matrix.base_class }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        base_class: ["StorageCatalog", "BaseCatalog"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Generate project
        run: |
          uvx copier copy --defaults --vcs-ref HEAD \
            --data catalog_name=sample \
            --data base_class=${{ matrix.base_class }} \
            --data author_name=CI \
            --data author_email=ci@example.com \
            . "$RUNNER_TEMP/project"

      # Wheels, not editable installs: dbt.adapters is a namespace package
      - name: Install dbt-polars from this checkout
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/wheels" .
          uv build --wheel --out-dir "$RUNNER_TEMP/wheels" catalogs/dbt-polars-catalog-local
          cd "$RUNNER_TEMP/project"
          uv sync --python 3.12
          uv pip install --reinstall "$RUNNER_TEMP"/wheels/*.whl

      - name: Lint and type check the generated project
        working-directory: ${{ runner.temp }}/project
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy

      # Fails when a stub for an abstract method is missing
      - name: Load the generated catalog
        working-directory: ${{ runner.temp }}/project
        run: |
          uv run --no-sync python -c "
          from dbt.adapters.polars.catalogs import create_catalog, resolve_catalog_plugin
          config = resolve_catalog_plugin('sample').config_class(
              name='sample', type='sample', schema='unused'
          )
          print(type(create_catalog(config, '')).__name__)
          "

      # Replace the stubs with a local-directory reference implementation
      - name: Test with the reference implementation
        run: |
          cp catalog-template/ci/catalog.py "$RUNNER_TEMP/project/dbt_polars_catalog_sample/catalog.py"
          cat catalog-template/ci/conftest_options.py >> "$RUNNER_TEMP/project/tests/conftest.py"
          cd "$RUNNER_TEMP/project"
          uv run --no-sync pytest -n auto
          uv build

  ruff:
    name: "Ruff"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

  mypy:
    name: "Type Check"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: mypy
        run: uv run mypy
