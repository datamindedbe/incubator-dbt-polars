name: CI (Databricks)

on:
  pull_request:
    types: [labeled]

jobs:
  test-iceberg-databricks:
    name: "Test iceberg-databricks"
    if: github.event.label.name == 'iceberg-databricks verified'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12 --extra iceberg

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run tests (iceberg-databricks catalog)
        env:
          DATABRICKS_WORKSPACE_URL: ${{ vars.DATABRICKS_WORKSPACE_URL }}
          DATABRICKS_UC_CATALOG: ${{ vars.DATABRICKS_UC_CATALOG }}
        run: uv run --python 3.12 pytest -n auto --profile iceberg-databricks

  test-databricks:
    name: "Test databricks"
    if: github.event.label.name == 'databricks verified'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12 --extra databricks

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run tests (databricks catalog)
        env:
          DATABRICKS_WORKSPACE_URL: ${{ vars.DATABRICKS_WORKSPACE_URL }}
          DATABRICKS_UC_CATALOG: ${{ vars.DATABRICKS_UC_CATALOG }}
        run: uv run --python 3.12 pytest -n auto --profile databricks
