name: CI (Databricks)

on:
  pull_request:

concurrency:
  group: ci-databricks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-databricks:
    name: "Test databricks / ${{ matrix.table_format }}"
    environment:
      name: databricks
      deployment: false
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - table_format: delta
            extras: --extra databricks
            config: default
          - table_format: iceberg
            extras: --extra databricks --extra iceberg
            config: table_format_iceberg

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12 ${{ matrix.extras }}

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run tests (databricks catalog, ${{ matrix.table_format }} tables)
        env:
          DATABRICKS_WORKSPACE_URL: ${{ vars.DATABRICKS_WORKSPACE_URL }}
          DATABRICKS_UC_CATALOG: ${{ vars.DATABRICKS_UC_CATALOG }}
        run: uv run --python 3.12 pytest -n 8 --profile databricks --config ${{ matrix.config }}
