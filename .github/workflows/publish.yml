name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Check version matches tag
        run: |
          TOML_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TOML_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: pyproject.toml has $TOML_VERSION but tag is $TAG_VERSION"
            exit 1
          fi

      - name: Extract release notes from changelog
        run: |
          awk -v heading="## $GITHUB_REF_NAME" '
            $0 == heading {found = 1; next}
            found && /^## / {exit}
            found {print}
          ' changelog.md > "$RUNNER_TEMP/release_notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release_notes.md"; then
            echo "No '## $GITHUB_REF_NAME' section in changelog.md"
            exit 1
          fi
          cat "$RUNNER_TEMP/release_notes.md"

      - name: Build
        run: uv build --all-packages

      # Catalog packages take their version from pyproject.toml, see catalogs/*/hatch_build.py
      - name: Check all packages have the tag version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ls dist
          for file in dist/*; do
            case "$file" in
              *-"$TAG_VERSION"-*.whl | *-"$TAG_VERSION".tar.gz) ;;
              *) echo "Unexpected version in $file (tag is $TAG_VERSION)"; exit 1 ;;
            esac
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release_notes.md"

      - name: Publish to PyPI
        run: uv publish
