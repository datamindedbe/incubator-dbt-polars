repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
    args: [--unsafe]
  - id: check-json
  - id: end-of-file-fixer
  - id: trailing-whitespace
  - id: check-case-conflict
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.19
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format
- repo: local
  hooks:
  - id: uv-sync
    name: uv sync
    entry: uv sync
    language: system
    pass_filenames: false
    always_run: true
  - id: mypy
    name: mypy
    entry: .venv/bin/mypy
    language: system
    pass_filenames: false
    files: ^dbt-polars/dbt/
