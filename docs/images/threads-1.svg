<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" width="640" height="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .ink { fill: #1f2328; }
    .muted { fill: #59636e; }
    .bg { fill: #ffffff; }
