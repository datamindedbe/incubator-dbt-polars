    .wait { fill: #ffffff; stroke: #0075ff; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .memory { fill: #ff694b; }
    .axis { stroke: #d0d7de; stroke-width: 1; }
  </style>
  <rect width="640" height="236" rx="12" class="bg"/>
  <text x="20" y="34" font-size="14" font-weight="600" class="ink">threads: 1</text>
  <text x="620" y="34" font-size="12" text-anchor="end" class="muted">Slow, one model in memory</text>
  <text x="118" y="58" font-size="12" text-anchor="end" class="ink">Model A</text>
  <rect x="130" y="48" width="48" height="13" rx="3" class="compute"/>
  <rect x="178" y="48.75" width="72" height="11.5" rx="3" class="wait"/>
  <text x="118" y="78" font-size="12" text-anchor="end" class="ink">Model B</text>
  <rect x="250" y="68" width="48" height="13" rx="3" class="compute"/>
  <rect x="298" y="68.75" width="72" height="11.5" rx="3" class="wait"/>
  <text x="118" y="98" font-size="12" text-anchor="end" class="ink">Model C</text>
  <rect x="370" y="88" width="48" height="13" rx="3" class="compute"/>
  <rect x="418" y="88.75" width="72" height="11.5" rx="3" class="wait"/>
  <text x="118" y="118" font-size="12" text-anchor="end" class="ink">Model D</text>
  <rect x="490" y="108" width="48" height="13" rx="3" class="compute"/>
  <rect x="538" y="108.75" width="72" height="11.5" rx="3" class="wait"/>
  <text x="118" y="168" font-size="12" text-anchor="end" class="muted">Memory</text>
  <line x1="130" y1="174" x2="610" y2="174" class="axis"/>
  <rect x="130" y="165" width="48" height="9" class="memory"/>
  <rect x="250" y="165" width="48" height="9" class="memory"/>
  <rect x="370" y="165" width="48" height="9" class="memory"/>
  <rect x="490" y="165" width="48" height="9" class="memory"/>
  <text x="610" y="188" font-size="11" text-anchor="end" class="muted">Time →</text>
  <rect x="130" y="206" width="22" height="12" rx="3" class="compute"/>
