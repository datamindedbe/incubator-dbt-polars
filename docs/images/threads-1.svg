  <rect x="320" y="206.75" width="22" height="10.5" rx="3" class="wait"/>
  <text x="350" y="216" font-size="12" class="ink">Registering the table</text>
  <rect x="510" y="206" width="22" height="12" class="memory"/>
  <text x="540" y="216" font-size="12" class="ink">Memory</text>
