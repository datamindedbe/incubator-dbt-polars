[project]
name = "dbt-polars"
version = "1.7.0"
description = "A dbt adapter for running models locally with Polars"
readme = "README.md"
license = { text = "Apache-2.0" }
# Python 3.14 excluded: dbt-core 1.11.x caps mashumaro<3.15; mashumaro 3.14 has no Python 3.14 support
requires-python = ">=3.10, <3.14"
keywords = ["dbt", "polars", "adapter", "data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = [
    "dbt-adapters>=1.0.0",
    "dbt-common>=1.0.0",
    "dbt-core>=1.11.2",
    # polars<2: str->Date cast is deprecated in 2.0; pin until adapter is updated
    "polars[deltalake,pyarrow]>=0.19,<2",
    "sqlglot>=1.0.0",
]

[dependency-groups]
dev = [
    "dbt-tests-adapter~=1.20.0",
    "pytest~=9.1.1",
    "pytest-xdist~=3.8.0",
    "types-pyyaml>=6.0.12.20260518",
    "azure-identity>=1.25.3",
]

[project.optional-dependencies]
# Pinned upper bound: iceberg_write_utils.py uses private pyiceberg APIs
# (_dataframe_to_data_files, ArrowScan). Re-test when bumping past this bound.
iceberg = ["pyiceberg[sql-sqlite, adlfs]>=0.9,<0.12"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dbt*"]

[tool.uv]
config-settings = { editable_mode = "compat" }

[tool.ruff]
line-length = 88

[tool.ruff.lint.per-file-ignores]
"tests/functional/adapter/simple_snapshot/fixtures.py" = ["E501"]

[tool.pytest.ini_options]
# CI runs with -n auto; keep -n 0 here for local development (easier debugging)
addopts = "-n 0"
markers = [
    "require_profiles(...): only run this test when --profile matches one of the listed names",
    "skip_profiles(...): skip this test when --profile matches one of the listed names",
]
filterwarnings = [
    "ignore:.*'soft_unicode' has been renamed to 'soft_str'*:DeprecationWarning",
    "ignore:unclosed file .*:ResourceWarning",
    # dbt-tests-adapter uses class-scoped fixtures as instance methods; fixed upstream eventually
    "ignore:Class-scoped fixture defined as instance method is deprecated:pytest.PytestRemovedIn10Warning",
    # Polars SQL engine internally casts date literals; not fixable from our side until Polars 2.0 drops support
    "ignore:Casting from String to Date is deprecated.*:DeprecationWarning",
]
testpaths = [
    "tests/unit",
    "tests/functional",
]
