[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-polars"
version = "0.1.0"
description = "A dbt adapter that executes models with Polars and stores data as Delta tables"
requires-python = ">=3.10"
dependencies = [
    "dbt-core>=1.8,<2.0",
    "dbt-adapters>=1.0,<2.0",
    "polars>=1.0",
    "deltalake>=0.17",
    "sqlglot>=30.8.0",
]

[project.entry-points."dbt.adapters"]
polars = "dbt.adapters.polars"

[tool.setuptools.packages.find]
where = ["."]
namespaces = true
include = ["dbt.*"]

[tool.setuptools.package-data]
"*" = ["*.sql", "*.yml", "*.md"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-dotenv",
    "pytest-logbook",
    "pytest-xdist",
    "black==24.2.0",
    "flake8",
    "freezegun",
    "mypy==1.8.0",
    "pre-commit",
    "pytz",
]
