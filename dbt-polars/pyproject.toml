[project]
name = "dbt-polars"
version = "1.7.0"
description = "A dbt adapter for running models locally with Polars"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10, <3.15"
keywords = ["dbt", "polars", "adapter", "data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
dependencies = [
    "dbt-adapters>=1.0.0",
    "dbt-common>=1.0.0",
    "dbt-core>=1.11.2",
    "deltalake[pyarrow]>=0.1.0",
    # polars<2: str->Date cast is deprecated in 2.0; pin until adapter is updated
    "polars>=0.19,<2",
    "sqlglot>=1.0.0",
]

[dependency-groups]
dev = [
    "dbt-tests-adapter~=1.20.0",
    "pytest~=9.1.1",
    "pytest-xdist~=3.8.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dbt*"]

[tool.uv]
config-settings = { editable_mode = "compat" }
