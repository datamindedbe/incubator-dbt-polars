[tool.uv.workspace]
members = ["dbt-polars"]

[dependency-groups]
dev = [
    "pre-commit",
    "ruff==0.15.19",
    # mypy and dbt-core 1.11.x have a pathspec conflict: dbt-core needs pathspec<0.13,
    # but mypy>=1.20 requires pathspec>=1.0.0. Pinned to highest compatible version.
    "mypy==1.19.1",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
namespace_packages = true
ignore_missing_imports = true
show_error_codes = true
files = ["dbt-polars/dbt"]
