[project]
name = "dbt-polars"
version = "0.2.0"
description = "A dbt adapter for running models with Polars"
readme = "README.md"
# Python 3.14 excluded: dbt-core 1.11.x caps mashumaro<3.15; mashumaro 3.14 has no Python 3.14 support
requires-python = ">=3.10, <3.14"
license = "Apache-2.0"
keywords = ["dbt", "polars", "adapter", "data"]
authors = [
  {name = "Jonas Crevecoeur", email = "jonas.crevecoeur@dataminded.com"}
]
maintainers = [
  {name = "Jonas Crevecoeur", email = "jonas.crevecoeur@dataminded.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = [
    "dbt-adapters>=1.23.0",
    "dbt-common>=1.0.0",
    "dbt-core>=1.11.2",
    "dbt-polars-catalog-local",
    "polars[deltalake,pyarrow]>=1.44.0",
    "sqlglot>=18.0.0",
]

[project.urls]
Homepage = "https://github.com/datamindedbe/incubator-dbt-polars"
Repository = "https://github.com/datamindedbe/incubator-dbt-polars"
Changelog = "https://github.com/datamindedbe/incubator-dbt-polars/releases"

[dependency-groups]
dev = [
    "dbt-polars-catalog-s3",
    "dbt-polars-catalog-azure",
    "dbt-polars-catalog-databricks",
    "dbt-tests-adapter~=1.20.0",
    "pytest~=9.1.1",
    "pytest-timeout~=2.3",
    "pytest-xdist~=3.8.0",
    "types-pyyaml>=6.0.12.20260518",
    "azure-identity>=1.25.3",
    "ruff==0.15.19",
    # mypy>=1.20 requires pathspec>=1.0.0, but dbt-core 1.11.x caps pathspec<0.13; pin to highest compatible version
    "mypy==1.19.1",
    "prek>=0.4.5",
]

[project.optional-dependencies]
# Pinned: iceberg_write_utils.py uses private pyiceberg APIs
# Test with each new adapter version to see if pyiceberg can be upgraded
iceberg = ["pyiceberg[sql-sqlite, adlfs]>=0.11.0,<=0.11.1"]
s3 = ["dbt-polars-catalog-s3"]
azure = ["dbt-polars-catalog-azure"]
databricks = ["dbt-polars-catalog-databricks"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dbt*"]

[tool.setuptools.package-data]
"dbt.include.polars" = ["*.yml", "macros/*.sql", "macros/**/*.sql"]

[tool.uv]
config-settings = { editable_mode = "compat" }

[tool.uv.workspace]
members = ["catalogs/*"]

[tool.uv.sources]
dbt-polars-catalog-local = { workspace = true }
dbt-polars-catalog-s3 = { workspace = true }
dbt-polars-catalog-azure = { workspace = true }
dbt-polars-catalog-databricks = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"dbt/adapters/polars/testing/data_operations/simple_snapshot/fixtures.py" = ["E501"]

[tool.pytest.ini_options]
# CI runs with -n auto; keep -n 0 here for local development (easier debugging)
addopts = "-n 0"
markers = [
    "require_profiles(...): only run this test when --profile matches one of the listed names",
    "skip_profiles(...): skip this test when --profile matches one of the listed names",
    "require_configs(...): only run this test when --config matches one of the listed names",
    "skip_configs(...): skip this test when --config matches one of the listed names",
]
filterwarnings = [
    "ignore:.*'soft_unicode' has been renamed to 'soft_str'*:DeprecationWarning",
    "ignore:unclosed file .*:ResourceWarning",
    # dbt-tests-adapter uses class-scoped fixtures as instance methods; fixed upstream eventually
    "ignore:Class-scoped fixture defined as instance method is deprecated:pytest.PytestRemovedIn10Warning",
    # Polars SQL engine internally casts date literals; not fixable from our side until Polars 2.0 drops support
    "ignore:Casting from String to Date is deprecated.*:DeprecationWarning",
]
testpaths = [
    "tests/unit",
    "tests/functional",
    "catalogs/*/tests",
]

[tool.mypy]
namespace_packages = true
ignore_missing_imports = true
show_error_codes = true
files = ["dbt", "catalogs/*/dbt_polars_catalog_*"]
