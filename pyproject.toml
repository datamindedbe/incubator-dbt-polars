[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-polars"
version = "0.1.0"
description = "A dbt adapter that executes models with Polars and stores data as Delta tables"
requires-python = ">=3.10"
dependencies = [
    "dbt-core>=1.8,<2.0",
    "polars>=1.0",
    "deltalake>=0.17",
    "duckdb>=1.0",
    "dbt-databricks>=1.12.0",
]

[project.entry-points."dbt.adapters"]
polars = "dbt.adapters.polars"

[tool.setuptools.packages.find]
where = ["."]
namespaces = true
include = ["dbt.*"]
